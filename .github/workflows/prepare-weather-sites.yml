name: Préparer les sites météo

# Manual collection. Publication requires an explicit input on the Terre Rouge repository.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Lieu à préparer
        type: choice
        options: [terre-rouge, tatins, both]
        default: terre-rouge
      group:
        description: Sources à vérifier (les caches encore valides sont réutilisés)
        type: choice
        options: [all, piaf, forecast]
        default: all
      publish:
        description: Publier Terre Rouge sur Pages après vérification des données
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ !inputs.publish || (github.repository == 'meteo-terrerouge/meteo-terrerouge.github.io' && inputs.site == 'terre-rouge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(inputs.site == 'both' && '["tatins","terre-rouge"]' || format('["{0}"]', inputs.site)) }}
    concurrency:
      group: weather-prepare-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v6
        with:
          path: .cache/weather-state/${{ matrix.site }}.json
          key: weather-state-v1-${{ matrix.site }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-state-v1-${{ matrix.site }}-
      - name: Collecter les données Météo-France
        id: collection
        continue-on-error: true
        env:
          SITE_ID: ${{ matrix.site }}
          SOURCE_GROUP: ${{ inputs.group }}
          METEO_FRANCE_API_KEY: ${{ secrets[format('METEO_FRANCE_API_KEY_{0}', matrix.site == 'tatins' && 'TATINS' || 'TERRE_ROUGE')] }}
        run: node scripts/collect-weather.mjs --site="$SITE_ID" --group="$SOURCE_GROUP" --state=".cache/weather-state/$SITE_ID.json" --output=".cache/weather-state/$SITE_ID.json"
      - name: Conserver les acquisitions réussies, même après un échec partiel
        if: always() && hashFiles(format('.cache/weather-state/{0}.json', matrix.site)) != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/weather-state/${{ matrix.site }}.json
          key: weather-state-v1-${{ matrix.site }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Générer le site avec les dernières données valides
        if: always() && hashFiles(format('.cache/weather-state/{0}.json', matrix.site)) != ''
        env:
          SITE_ID: ${{ matrix.site }}
        run: node scripts/prepare-site.mjs --site="$SITE_ID" --state=".cache/weather-state/$SITE_ID.json"
      - name: Vérifier les données avant publication
        if: inputs.publish
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const entry = JSON.parse(await readFile('.cache/weather-state/terre-rouge.json', 'utf8'));
          if (entry.siteId !== 'terre-rouge' || !entry.arome?.hours?.length || !entry.arpegeWeek?.days?.length || !entry.piaf?.values?.length) {
            throw new Error('Les données principales sont incomplètes : publication annulée.');
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-${{ matrix.site }}
          path: .cache/sites/${{ matrix.site }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-pages-artifact@v5
        if: inputs.publish
        with:
          path: .cache/sites/terre-rouge/
      - name: Signaler une collecte partielle
        if: steps.collection.outcome == 'failure'
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          echo "::warning::Collecte partielle : consulter le bilan Météo-France."
          if [ "$PUBLISH" != "true" ]; then exit 1; fi

  deploy:
    if: ${{ inputs.publish && github.repository == 'meteo-terrerouge/meteo-terrerouge.github.io' && inputs.site == 'terre-rouge' }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-terre-rouge
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
