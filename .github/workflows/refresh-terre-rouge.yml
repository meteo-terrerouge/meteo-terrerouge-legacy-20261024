name: Actualiser Terre Rouge
on:
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Sources à renouveler, ou cached pour vérifier sans collecte.
        type: choice
        options: [all, piaf, forecast, cached]
        default: cached
      publish:
        description: Publier le résultat (uniquement depuis main).
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  engine:
    if: github.repository == 'meteo-terrerouge/meteo-terrerouge.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nicklausFR/bulletin-local-meteo-france
          ref: main
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le dernier moteur commun
        run: |
          npm ci --prefix .engine --ignore-scripts --no-audit --no-fund
          npm run check --prefix .engine
          npm test --prefix .engine
      - name: Réutiliser la même révision dans tous les jobs
        id: revision
        shell: bash
        run: echo "sha=$(git -C .engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  collect:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event_name == 'schedule' && (github.event.schedule == '17 * * * *' && '["forecast"]' || '["piaf"]') || (inputs.group == 'all' && '["piaf","forecast"]' || format('["{0}"]', inputs.group))) }}
    concurrency:
      group: weather-auto-collect-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nicklausFR/bulletin-local-meteo-france
          ref: ${{ needs.engine.outputs.revision }}
          path: .engine
      - uses: actions/cache/restore@v4
        with:
          path: .cache/collect-${{ matrix.group }}/terre-rouge.json
          key: weather-auto-v1-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-auto-v1-${{ matrix.group }}-
      - uses: actions/cache/restore@v4
        with:
          path: .cache/weather-state/terre-rouge.json
          key: weather-state-v1-terre-rouge-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-state-v1-terre-rouge-
      - name: Utiliser le moteur hérité avec la configuration locale
        id: collection
        continue-on-error: true
        uses: ./.engine
        with:
          profile: site.json
          state: .cache/collect-${{ matrix.group }}/terre-rouge.json
          collect: ${{ matrix.group != 'cached' }}
          group: ${{ matrix.group == 'cached' && 'all' || matrix.group }}
          updates: .cache/weather-state
        env:
          METEO_FRANCE_API_KEY: ${{ secrets.METEO_FRANCE_API_KEY_TERRE_ROUGE }}
      - name: Conserver chaque acquisition réussie
        if: always() && hashFiles(format('.cache/collect-{0}/terre-rouge.json', matrix.group)) != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/collect-${{ matrix.group }}/terre-rouge.json
          key: weather-auto-v1-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('.cache/collect-{0}/terre-rouge.json', matrix.group)) != ''
        with:
          name: weather-update-${{ matrix.group }}
          path: .cache/collect-${{ matrix.group }}/terre-rouge.json
          retention-days: 1
      - name: Fournir un aperçu téléchargeable
        if: always() && steps.collection.outputs.site-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: inherited-site-${{ matrix.group }}
          path: ${{ steps.collection.outputs.site-directory }}
          include-hidden-files: true
          retention-days: 3
      - name: Signaler une préparation incomplète
        if: steps.collection.outcome == 'failure'
        run: exit 1

  publish:
    needs: [engine, collect]
    if: >-
      ${{ always() && !cancelled()
        && github.repository == 'meteo-terrerouge/meteo-terrerouge.github.io'
        && github.ref == 'refs/heads/main'
        && (github.event_name == 'schedule' || inputs.publish == true)
        && (needs.collect.result == 'success' || needs.collect.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-terre-rouge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: nicklausFR/bulletin-local-meteo-france
          ref: ${{ needs.engine.outputs.revision }}
          path: .engine
      - uses: actions/cache/restore@v4
        with:
          path: .cache/weather-state/terre-rouge.json
          key: weather-published-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-published-v1-
      - uses: actions/cache/restore@v4
        with:
          path: .cache/collect-piaf/terre-rouge.json
          key: weather-auto-v1-piaf-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-auto-v1-piaf-
      - uses: actions/cache/restore@v4
        with:
          path: .cache/collect-forecast/terre-rouge.json
          key: weather-auto-v1-forecast-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-auto-v1-forecast-
      - uses: actions/download-artifact@v4
        with:
          pattern: weather-update-*
          path: .cache/downloaded
      - name: Fusionner et construire avec le moteur hérité
        id: bulletin
        uses: ./.engine
        with:
          profile: site.json
          state: .cache/weather-state/terre-rouge.json
          collect: 'false'
          updates: |
            .cache/collect-piaf
            .cache/collect-forecast
            .cache/downloaded
      - name: Vérifier les données avant publication
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const profile = JSON.parse(await readFile('site.json', 'utf8'));
          const entry = JSON.parse(await readFile('.cache/weather-state/terre-rouge.json', 'utf8'));
          if (entry.siteId !== profile.id || entry.latitude !== profile.latitude || entry.longitude !== profile.longitude
            || !entry.arome?.hours?.length || !entry.arpegeWeek?.days?.length || !entry.piaf?.values?.length) {
            throw new Error('Données principales incomplètes : publication annulée.');
          }
          NODE
      - uses: actions/cache/save@v4
        with:
          path: .cache/weather-state/terre-rouge.json
          key: weather-published-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.bulletin.outputs.site-directory }}
      - uses: actions/deploy-pages@v4
        id: deployment
